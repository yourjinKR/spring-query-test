spring:
  application:
    name: query-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/querylab}
    username: ${DB_USERNAME:querylab}
    password: ${DB_PASSWORD:querylab}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        cache:
          use_second_level_cache: false
          use_query_cache: false
        query:
          fail_on_pagination_over_collection_fetch: true
        jdbc:
          fetch_size: 0
  flyway:
    enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
lab:
  seed-on-startup: ${LAB_SEED_ON_STARTUP:true}
