spring:
  application:
    name: query-lab
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/querylab}
    username: ${DB_USERNAME:querylab}
    password: ${DB_PASSWORD:querylab}
    hikari:
      pool-name: query-lab
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:${DB_POOL_SIZE:10}}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:500}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        cache:
          use_second_level_cache: false
          use_query_cache: false
        query:
          fail_on_pagination_over_collection_fetch: true
        jdbc:
          fetch_size: 0
  flyway:
    enabled: true
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
        hikaricp.connections.usage: true
      slo:
        hikaricp.connections.acquire: 10us,50us,100us,250us,500us,1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,5s,30s
        hikaricp.connections.usage: 1ms,5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,5s,30s
lab:
  seed-on-startup: ${LAB_SEED_ON_STARTUP:true}
